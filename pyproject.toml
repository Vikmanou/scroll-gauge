[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrollgauge"
version = "0.1.0"
description = "Set global and per-app touchpad scroll speed on GNOME Wayland"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: GTK",
    "Topic :: Desktop Environment :: Gnome",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Vikmanou/scroll-gauge"
Issues = "https://github.com/Vikmanou/scroll-gauge/issues"

[project.optional-dependencies]
test = ["pytest"]

[project.gui-scripts]
scrollgauge = "scrollgauge.app:main"

[tool.setuptools]
packages = ["scrollgauge"]

[tool.setuptools.data-files]
"share/applications" = ["data/io.github.vikmanou.ScrollGauge.desktop"]
